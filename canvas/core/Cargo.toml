[package]
name = "canvas-core"
edition = "2024"
version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/canvas.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
ide = { path = "../../crates/ide" }
semantics = { path = "../../crates/semantics" }
syntax = { path = "../../crates/syntax" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
salsa = "=0.28.0"
