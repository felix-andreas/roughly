[workspace]
resolver = "3"
members = ["core"]

# The canvas is a standalone project that consumes ry's parser, name
# resolution, and type checker as libraries. It is its own workspace so it
# builds for wasm32 without dragging the language server's native-only
# dependency graph along, and so moving it out of this repository is a
# directory move rather than a dependency untangling.

[workspace.package]
version = "0.1.0"
license = "UPL-1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
