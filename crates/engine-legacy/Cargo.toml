[package]
name = "engine-legacy"
edition = "2024"
version.workspace = true
publish = false

# Descriptive lib root per the repo guideline (no default lib.rs). Package renamed for the
# greenfield rewrite; the lib target keeps its original name so `use engine::` needs no churn.
[lib]
name = "engine"
path = "src/engine.rs"

[dependencies]
# The R query bodies reuse `analysis`'s public phase functions (parse, lower, naming, inference) verbatim;
# the generic engine core in `engine.rs` stays analysis-free, the R layer lives in `queries.rs`.
analysis-legacy = { path = "../analysis-legacy" }
ropey.workspace = true
rustc-hash.workspace = true
stacker = "0.1.24"
tree-sitter.workspace = true
