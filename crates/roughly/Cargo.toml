[package]
name = "roughly"
edition = "2024"
rust-version = "1.88"
version.workspace = true
description = "A language tool for R: a language server and CLI providing a static type checker, formatter, and linter."
license.workspace = true
repository.workspace = true
keywords = ["r", "language-server", "lsp", "formatter", "linter"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "roughly"
path = "src/roughly.rs"

[[bin]]
name = "roughly"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dirs = "6"
console.workspace = true
ignore.workspace = true
salsa.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_ignored = "0.1"
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
unicode-width.workspace = true

format = { path = "../format" }
ide = { path = "../ide" }
repl = { path = "../repl" }
semantics = { path = "../semantics" }
syntax = { path = "../syntax" }

# async-lsp
async-lsp.workspace = true
tower.workspace = true
futures.workspace = true

[target.'cfg(not(unix))'.dependencies]
tokio-util.workspace = true

[dev-dependencies]
async-lsp.workspace = true
indoc.workspace = true
portable-pty = "0.9"
tempfile = "3"
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower.workspace = true
