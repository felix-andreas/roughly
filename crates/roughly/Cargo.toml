[package]
name = "roughly"
edition = "2024"
version.workspace = true

[dependencies]
clap.workspace = true
console.workspace = true
ignore.workspace = true
indoc.workspace = true
itertools.workspace = true
ropey.workspace = true
serde.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
tree-sitter.workspace = true
tree-sitter-r.workspace = true
serde_json.workspace = true
analysis = { path = "../analysis" }

# async-lsp
async-lsp.workspace = true
tower.workspace = true
futures.workspace = true

[features]
# Forwards to `analysis/verify-incremental` so the incremental-drift assertions compile into release
# builds of the whole workspace; lets `cargo ... --features verify-incremental` work from the root.
verify-incremental = ["analysis/verify-incremental"]

[target.'cfg(not(unix))'.dependencies]
tokio-util.workspace = true

[dev-dependencies]
async-lsp.workspace = true
fixtures = { path = "../fixtures" }
futures.workspace = true
insta.workspace = true
regex.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower.workspace = true
