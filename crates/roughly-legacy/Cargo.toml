[package]
name = "roughly-legacy"
edition = "2024"
# Minimum supported Rust: the code uses `if let ... && let ...` let-chains, stabilized in 1.88 — the
# binding floor above edition 2024's own 1.85 requirement.
rust-version = "1.88"
version.workspace = true
description = "A language tool for R: a language server and CLI providing a static type checker, formatter, and linter."
# `license` is the SPDX metadata; the LICENSE file is copied into this crate so a published tarball
# ships the text (the tarball only includes files under the crate directory).
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["r", "language-server", "lsp", "formatter", "linter"]
categories = ["development-tools", "command-line-utilities"]

# Frozen legacy stack: the Phase 3 cutover moved the `roughly` lib and bin names to the new
# `crates/roughly`; this crate keeps building under the `-legacy` names as oracle + benchmark.
[lib]
name = "roughly_legacy"
path = "src/lib.rs"

[[bin]]
name = "roughly-legacy"
path = "src/main.rs"

[dependencies]
clap.workspace = true
console.workspace = true
ignore.workspace = true
indoc.workspace = true
itertools.workspace = true
ropey.workspace = true
serde.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
tree-sitter.workspace = true
serde_json.workspace = true
analysis-legacy = { path = "../analysis-legacy" }
engine-legacy = { path = "../engine-legacy" }

# async-lsp
async-lsp.workspace = true
tower.workspace = true
futures.workspace = true

[target.'cfg(not(unix))'.dependencies]
tokio-util.workspace = true

[dev-dependencies]
async-lsp.workspace = true
fixtures = { path = "../fixtures" }
tempfile = "3"
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tower.workspace = true
# Only the grammar smoke test (test_tree.rs) references the R grammar directly; src reaches it via
# `analysis`, so this is a test-only dependency.
tree-sitter-r.workspace = true
