[package]
name = "analysis"
edition = "2024"
version.workspace = true

[lib]
path = "src/lib.rs"

[features]
# Additive, off by default: compiles the `query_spike` shadow memo-engine prototype and its
# cross-check/measurement tests. A de-risking investigation only; never part of normal/release builds
# and it changes no production code path.
query-spike = []

[dependencies]
ropey.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-r.workspace = true

[dev-dependencies]
fixtures = { path = "../fixtures" }
indoc.workspace = true
insta.workspace = true
itertools.workspace = true
serde.workspace = true
serde_json.workspace = true
