[package]
name = "engine"
edition = "2024"
version.workspace = true
publish = false

# Descriptive lib root per the repo guideline (no default lib.rs).
[lib]
path = "src/engine.rs"

[dependencies]
# The R query bodies reuse `analysis`'s public phase functions (parse, lower, naming, inference) verbatim;
# the generic engine core in `engine.rs` stays analysis-free, the R layer lives in `queries.rs`.
analysis = { path = "../analysis" }
ropey.workspace = true
tree-sitter.workspace = true
