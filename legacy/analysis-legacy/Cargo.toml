[package]
name = "analysis-legacy"
edition = "2024"
version.workspace = true
publish = false

# Package renamed for the greenfield rewrite; the lib target keeps its original
# name so `use analysis::` in this frozen stack needs no source churn.
[lib]
name = "analysis"
path = "src/lib.rs"

[dependencies]
ropey.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
tree-sitter.workspace = true
tree-sitter-r.workspace = true

[dev-dependencies]
fixtures = { path = "../fixtures" }
itertools.workspace = true
serde_json.workspace = true
